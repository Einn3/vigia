name: Incident issues

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync incidents to issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/incident-issues.py
